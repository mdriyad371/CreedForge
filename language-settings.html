<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ভাষা সেটিংস - ProjectMarket</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: 0.3s;
        }

        body.dark-mode {
            background: #0f0f1a;
        }

        .app-container {
            width: 390px;
            height: 780px;
            background: #ffffff;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: 0.3s;
        }

        body.dark-mode .app-container {
            background: #1a1a2e;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px 8px 15px;
            background: #ffffff;
            border-bottom: 1px solid #f0f0f0;
            flex-shrink: 0;
            transition: 0.3s;
        }

        body.dark-mode .top-bar {
            background: #1a1a2e;
            border-bottom-color: #2a2a4e;
        }

        .top-bar .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            cursor: pointer;
        }

        .top-bar .logo i {
            font-size: 24px;
            color: #e94560;
        }

        .top-bar .logo h2 {
            font-size: 18px;
            font-weight: 700;
            color: #1a1a2e;
            transition: 0.3s;
        }

        body.dark-mode .top-bar .logo h2 {
            color: #fff;
        }

        .top-bar .logo h2 span {
            color: #e94560;
        }

        .top-bar .logo small {
            font-size: 8px;
            color: #888;
            font-weight: 400;
            display: block;
            margin-top: -2px;
        }

        body.dark-mode .top-bar .logo small {
            color: #666;
        }

        .top-bar .right-icons {
            display: flex;
            gap: 14px;
            font-size: 18px;
            color: #1a1a2e;
        }

        body.dark-mode .top-bar .right-icons {
            color: #fff;
        }

        .top-bar .right-icons i {
            cursor: pointer;
            transition: 0.2s;
        }

        .top-bar .right-icons i:hover {
            color: #e94560;
        }

        .page-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px 15px 80px 15px;
            background: #fafafa;
            transition: 0.3s;
        }

        body.dark-mode .page-content {
            background: #16213e;
        }

        .page-content::-webkit-scrollbar {
            width: 0;
        }

        .back-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 5px 0 12px 0;
        }

        .back-header i {
            font-size: 20px;
            color: #1a1a2e;
            cursor: pointer;
            transition: 0.3s;
        }

        body.dark-mode .back-header i {
            color: #fff;
        }

        .back-header h3 {
            font-size: 18px;
            color: #1a1a2e;
            transition: 0.3s;
        }

        body.dark-mode .back-header h3 {
            color: #fff;
        }

        .language-item {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #fff;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid #eee;
            margin-bottom: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        body.dark-mode .language-item {
            background: #1a1a2e;
            border-color: #2a2a4e;
        }

        .language-item:hover {
            border-color: #e94560;
        }

        .language-item.active {
            border-color: #e94560;
            background: #fef0f2;
        }

        body.dark-mode .language-item.active {
            background: #2a1a2e;
        }

        .language-item .flag {
            font-size: 28px;
        }

        .language-item .info {
            flex: 1;
        }

        .language-item .info .name {
            font-size: 14px;
            font-weight: 600;
            color: #1a1a2e;
        }

        body.dark-mode .language-item .info .name {
            color: #fff;
        }

        .language-item .info .native {
            font-size: 12px;
            color: #888;
        }

        body.dark-mode .language-item .info .native {
            color: #666;
        }

        .language-item .check {
            color: #e94560;
            font-size: 18px;
            display: none;
        }

        .language-item.active .check {
            display: block;
        }

        .btn-save-language {
            width: 100%;
            background: #e94560;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
        }

        .btn-save-language:hover {
            background: #c0392b;
        }

        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            display: flex;
            justify-content: space-around;
            padding: 8px 0 10px 0;
            border-top: 1px solid #eee;
            flex-shrink: 0;
            transition: 0.3s;
        }

        body.dark-mode .bottom-nav {
            background: #1a1a2e;
            border-top-color: #2a2a4e;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            color: #888;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
        }

        body.dark-mode .nav-item {
            color: #666;
        }

        .nav-item i {
            font-size: 20px;
            margin-bottom: 2px;
        }

        .nav-item.active {
            color: #e94560;
        }

        .nav-item:hover {
            color: #e94560;
        }

        @media (max-width: 420px) {
            .app-container {
                width: 100%;
                height: 100vh;
                border-radius: 0;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">

        <div class="top-bar">
            <a href="index.html" class="logo">
                <i class="fas fa-project-diagram"></i>
                <div>
                    <h2>Project<span>Market</span></h2>
                    <small>ফ্রিল্যান্স মার্কেটপ্লেস</small>
                </div>
            </a>
            <div class="right-icons">
                <i class="fas fa-search" onclick="location.href='search.html'"></i>
                <i class="fas fa-user" onclick="navigateToProfile()"></i>
            </div>
        </div>

        <div class="page-content">

            <div class="back-header">
                <i class="fas fa-arrow-left" onclick="history.back()"></i>
                <h3>🌐 ভাষা সেটিংস</h3>
            </div>

            <div class="language-item active" onclick="selectLanguage(this, 'bn')">
                <span class="flag">🇧🇩</span>
                <div class="info">
                    <div class="name">বাংলা</div>
                    <div class="native">Bangla</div>
                </div>
                <span class="check"><i class="fas fa-check-circle"></i></span>
            </div>

            <div class="language-item" onclick="selectLanguage(this, 'en')">
                <span class="flag">🇬🇧</span>
                <div class="info">
                    <div class="name">English</div>
                    <div class="native">English</div>
                </div>
                <span class="check"><i class="fas fa-check-circle"></i></span>
            </div>

            <div class="language-item" onclick="selectLanguage(this, 'ar')">
                <span class="flag">🇸🇦</span>
                <div class="info">
                    <div class="name">العربية</div>
                    <div class="native">Arabic</div>
                </div>
                <span class="check"><i class="fas fa-check-circle"></i></span>
            </div>

            <div class="language-item" onclick="selectLanguage(this, 'hi')">
                <span class="flag">🇮🇳</span>
                <div class="info">
                    <div class="name">हिन्दी</div>
                    <div class="native">Hindi</div>
                </div>
                <span class="check"><i class="fas fa-check-circle"></i></span>
            </div>

            <div class="language-item" onclick="selectLanguage(this, 'es')">
                <span class="flag">🇪🇸</span>
                <div class="info">
                    <div class="name">Español</div>
                    <div class="native">Spanish</div>
                </div>
                <span class="check"><i class="fas fa-check-circle"></i></span>
            </div>

            <button class="btn-save-language" onclick="saveLanguage()">
                <i class="fas fa-save"></i> ভাষা সংরক্ষণ করুন
            </button>

        </div>

        <div class="bottom-nav">
            <a href="index.html" class="nav-item">
                <i class="fas fa-home"></i>
                <span>হোম</span>
            </a>
            <a href="category.html" class="nav-item">
                <i class="fas fa-th-large"></i>
                <span>ক্যাটাগরি</span>
            </a>
            <a href="workers.html" class="nav-item">
                <i class="fas fa-users"></i>
                <span>ওয়ার্কার</span>
            </a>
            <a href="profile.html" class="nav-item active">
                <i class="fas fa-user"></i>
                <span>প্রোফাইল</span>
            </a>
        </div>
    </div>

    <script>
        let selectedLanguage = 'bn';

        document.addEventListener('DOMContentLoaded', function() {
            if (localStorage.getItem('darkMode') === 'true') {
                document.body.classList.add('dark-mode');
            }

            const savedLang = localStorage.getItem('language') || 'bn';
            document.querySelectorAll('.language-item').forEach(item => {
                item.classList.remove('active');
                const lang = item.getAttribute('onclick').match(/'([^']+)'/)[1];
                if (lang === savedLang) {
                    item.classList.add('active');
                    selectedLanguage = savedLang;
                }
            });
        });

        function selectLanguage(element, lang) {
            document.querySelectorAll('.language-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');
            selectedLanguage = lang;
        }

        function saveLanguage() {
            localStorage.setItem('language', selectedLanguage);
            alert('✅ ভাষা সফলভাবে সংরক্ষণ করা হয়েছে!');
            window.location.href = 'profile.html';
        }

        function navigateToProfile() {
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            if (isLoggedIn) {
                window.location.href = 'profile.html';
            } else {
                window.location.href = 'login.html';
            }
        }
    </script>

</body>
</html>
