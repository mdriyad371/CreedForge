<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>অর্ডার ফর্ম - ProjectMarket</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 390px;
            height: 780px;
            background: #ffffff;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px 8px 15px;
            background: #ffffff;
            border-bottom: 1px solid #f0f0f0;
            flex-shrink: 0;
        }

        .top-bar .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            cursor: pointer;
        }

        .top-bar .logo i {
            font-size: 24px;
            color: #e94560;
        }

        .top-bar .logo h2 {
            font-size: 18px;
            font-weight: 700;
            color: #1a1a2e;
        }

        .top-bar .logo h2 span {
            color: #e94560;
        }

        .top-bar .logo small {
            font-size: 8px;
            color: #888;
            font-weight: 400;
            display: block;
            margin-top: -2px;
        }

        .top-bar .right-icons {
            display: flex;
            gap: 14px;
            font-size: 18px;
            color: #1a1a2e;
        }

        .top-bar .right-icons i {
            cursor: pointer;
            transition: 0.2s;
        }

        .top-bar .right-icons i:hover {
            color: #e94560;
        }

        .page-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px 15px 80px 15px;
            background: #fafafa;
        }

        .page-content::-webkit-scrollbar {
            width: 0;
        }

        .back-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 5px 0 12px 0;
        }

        .back-header i {
            font-size: 20px;
            color: #1a1a2e;
            cursor: pointer;
        }

        .back-header h3 {
            font-size: 18px;
            color: #1a1a2e;
        }

        .project-summary {
            background: #fff;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid #eee;
            margin-bottom: 16px;
        }

        .project-summary h4 {
            font-size: 14px;
            color: #1a1a2e;
            margin-bottom: 6px;
        }

        .project-summary .info-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 13px;
            color: #555;
        }

        .project-summary .info-row .label {
            color: #888;
        }

        .project-summary .info-row .value {
            font-weight: 600;
            color: #1a1a2e;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 4px;
        }

        .form-group label .required {
            color: #e94560;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 13px;
            outline: none;
            background: #fff;
            transition: 0.2s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #e94560;
        }

        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }

        .btn-submit {
            width: 100%;
            background: #e94560;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 4px;
        }

        .btn-submit:hover {
            background: #c0392b;
        }

        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            display: flex;
            justify-content: space-around;
            padding: 8px 0 10px 0;
            border-top: 1px solid #eee;
            flex-shrink: 0;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            color: #888;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
        }

        .nav-item i {
            font-size: 20px;
            margin-bottom: 2px;
        }

        .nav-item.active {
            color: #e94560;
        }

        .nav-item:hover {
            color: #e94560;
        }

        @media (max-width: 420px) {
            .app-container {
                width: 100%;
                height: 100vh;
                border-radius: 0;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">

        <div class="top-bar">
            <a href="index.html" class="logo">
                <i class="fas fa-project-diagram"></i>
                <div>
                    <h2>Project<span>Market</span></h2>
                    <small>ফ্রিল্যান্স মার্কেটপ্লেস</small>
                </div>
            </a>
            <div class="right-icons">
                <i class="fas fa-search" onclick="alert('সার্চ খোলা হবে')"></i>
                <i class="fas fa-user" onclick="navigateToProfile()"></i>
            </div>
        </div>

        <div class="page-content">

            <div class="back-header">
                <i class="fas fa-arrow-left" onclick="history.back()"></i>
                <h3>📝 অর্ডার ফর্ম</h3>
            </div>

            <div class="project-summary">
                <h4>📌 আপনি অর্ডার করছেন:</h4>
                <div class="info-row">
                    <span class="label">প্রজেক্ট:</span>
                    <span class="value">পূর্ণাঙ্গ ই-কমার্স সাইট</span>
                </div>
                <div class="info-row">
                    <span class="label">ডেভেলপার:</span>
                    <span class="value">শাহরিয়ার হাসান</span>
                </div>
                <div class="info-row">
                    <span class="label">মূল্য:</span>
                    <span class="value" style="color:#e94560;">৳ ১৫,০০০</span>
                </div>
                <div class="info-row">
                    <span class="label">ডেলিভারি সময়:</span>
                    <span class="value">৭ দিন</span>
                </div>
            </div>

            <form id="orderForm" onsubmit="submitOrder(event)">
                <div class="form-group">
                    <label>প্রজেক্টের নাম <span class="required">*</span></label>
                    <input type="text" value="পূর্ণাঙ্গ ই-কমার্স সাইট" required />
                </div>

                <div class="form-group">
                    <label>বিশেষ প্রয়োজনীয়তা</label>
                    <textarea placeholder="আপনার অতিরিক্ত চাহিদাগুলো লিখুন..."></textarea>
                </div>

                <div class="form-group">
                    <label>কাঙ্খিত ডেলিভারি তারিখ <span class="required">*</span></label>
                    <input type="date" id="deadline" required />
                </div>

                <div class="form-group">
                    <label>পেমেন্ট পদ্ধতি <span class="required">*</span></label>
                    <select required>
                        <option value="">পছন্দ করুন</option>
                        <option value="wallet">ওয়ালেট ব্যালেন্স (৳ ২৫,৪৫০)</option>
                        <option value="ssl">SSL কমার্জ</option>
                        <option value="bkash">বিকাশ</option>
                        <option value="nagad">নগদ</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>অতিরিক্ত নোট</label>
                    <textarea placeholder="ডেভেলপারকে জানাতে চান কিছু?"></textarea>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fas fa-check-circle"></i> অর্ডার কনফর্ম করুন
                </button>
            </form>

        </div>

        <div class="bottom-nav">
            <a href="index.html" class="nav-item">
                <i class="fas fa-home"></i>
                <span>হোম</span>
            </a>
            <a href="category.html" class="nav-item">
                <i class="fas fa-th-large"></i>
                <span>ক্যাটাগরি</span>
            </a>
            <a href="workers.html" class="nav-item">
                <i class="fas fa-users"></i>
                <span>ওয়ার্কার</span>
            </a>
            <a href="profile.html" class="nav-item active">
                <i class="fas fa-user"></i>
                <span>প্রোফাইল</span>
            </a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const dateInput = document.getElementById('deadline');
            const today = new Date();
            const deadline = new Date(today);
            deadline.setDate(today.getDate() + 7);
            dateInput.value = deadline.toISOString().split('T')[0];
        });

        function submitOrder(e) {
            e.preventDefault();
            const confirmOrder = confirm('আপনি কি এই প্রজেক্টটি অর্ডার করতে চান?');
            if (confirmOrder) {
                alert('🎉 আপনার অর্ডার সফলভাবে প্লেস করা হয়েছে!\nঅর্ডার আইডি: #ORD-' + Date.now().toString().slice(-6));
                location.href = 'orders.html';
            }
        }

        function navigateToProfile() {
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            if (isLoggedIn) {
                window.location.href = 'profile.html';
            } else {
                window.location.href = 'login.html';
            }
        }
    </script>

</body>
</html>
