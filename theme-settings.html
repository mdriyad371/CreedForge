<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>থিম সেটিংস - ProjectMarket</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: 0.3s;
        }

        body.dark-mode {
            background: #0f0f1a;
        }

        .app-container {
            width: 390px;
            height: 780px;
            background: #ffffff;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: 0.3s;
        }

        body.dark-mode .app-container {
            background: #1a1a2e;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px 8px 15px;
            background: #ffffff;
            border-bottom: 1px solid #f0f0f0;
            flex-shrink: 0;
            transition: 0.3s;
        }

        body.dark-mode .top-bar {
            background: #1a1a2e;
            border-bottom-color: #2a2a4e;
        }

        .top-bar .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            cursor: pointer;
        }

        .top-bar .logo i {
            font-size: 24px;
            color: #e94560;
        }

        .top-bar .logo h2 {
            font-size: 18px;
            font-weight: 700;
            color: #1a1a2e;
            transition: 0.3s;
        }

        body.dark-mode .top-bar .logo h2 {
            color: #fff;
        }

        .top-bar .logo h2 span {
            color: #e94560;
        }

        .top-bar .logo small {
            font-size: 8px;
            color: #888;
            font-weight: 400;
            display: block;
            margin-top: -2px;
        }

        body.dark-mode .top-bar .logo small {
            color: #666;
        }

        .top-bar .right-icons {
            display: flex;
            gap: 14px;
            font-size: 18px;
            color: #1a1a2e;
        }

        body.dark-mode .top-bar .right-icons {
            color: #fff;
        }

        .top-bar .right-icons i {
            cursor: pointer;
            transition: 0.2s;
        }

        .top-bar .right-icons i:hover {
            color: #e94560;
        }

        .page-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px 15px 80px 15px;
            background: #fafafa;
            transition: 0.3s;
        }

        body.dark-mode .page-content {
            background: #16213e;
        }

        .page-content::-webkit-scrollbar {
            width: 0;
        }

        .back-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 5px 0 12px 0;
        }

        .back-header i {
            font-size: 20px;
            color: #1a1a2e;
            cursor: pointer;
            transition: 0.3s;
        }

        body.dark-mode .back-header i {
            color: #fff;
        }

        .back-header h3 {
            font-size: 18px;
            color: #1a1a2e;
            transition: 0.3s;
        }

        body.dark-mode .back-header h3 {
            color: #fff;
        }

        .setting-card {
            background: #fff;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #eee;
            margin-bottom: 12px;
            transition: 0.3s;
        }

        body.dark-mode .setting-card {
            background: #1a1a2e;
            border-color: #2a2a4e;
        }

        .setting-card h4 {
            font-size: 14px;
            color: #1a1a2e;
            margin-bottom: 10px;
        }

        body.dark-mode .setting-card h4 {
            color: #fff;
        }

        .theme-options {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        .theme-option {
            padding: 16px 10px;
            border: 2px solid #ddd;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }

        body.dark-mode .theme-option {
            border-color: #2a2a4e;
        }

        .theme-option:hover {
            border-color: #e94560;
        }

        .theme-option.active {
            border-color: #e94560;
            background: #fef0f2;
        }

        body.dark-mode .theme-option.active {
            background: #2a1a2e;
        }

        .theme-option .icon {
            font-size: 28px;
            display: block;
            margin-bottom: 4px;
        }

        .theme-option .name {
            font-size: 12px;
            font-weight: 600;
            color: #1a1a2e;
        }

        body.dark-mode .theme-option .name {
            color: #fff;
        }

        .theme-option .desc {
            font-size: 10px;
            color: #888;
        }

        body.dark-mode .theme-option .desc {
            color: #666;
        }

        .btn-save-theme {
            width: 100%;
            background: #e94560;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
        }

        .btn-save-theme:hover {
            background: #c0392b;
        }

        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            display: flex;
            justify-content: space-around;
            padding: 8px 0 10px 0;
            border-top: 1px solid #eee;
            flex-shrink: 0;
            transition: 0.3s;
        }

        body.dark-mode .bottom-nav {
            background: #1a1a2e;
            border-top-color: #2a2a4e;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            color: #888;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
        }

        body.dark-mode .nav-item {
            color: #666;
        }

        .nav-item i {
            font-size: 20px;
            margin-bottom: 2px;
        }

        .nav-item.active {
            color: #e94560;
        }

        .nav-item:hover {
            color: #e94560;
        }

        @media (max-width: 420px) {
            .app-container {
                width: 100%;
                height: 100vh;
                border-radius: 0;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">

        <div class="top-bar">
            <a href="index.html" class="logo">
                <i class="fas fa-project-diagram"></i>
                <div>
                    <h2>Project<span>Market</span></h2>
                    <small>ফ্রিল্যান্স মার্কেটপ্লেস</small>
                </div>
            </a>
            <div class="right-icons">
                <i class="fas fa-search" onclick="location.href='search.html'"></i>
                <i class="fas fa-user" onclick="navigateToProfile()"></i>
            </div>
        </div>

        <div class="page-content">

            <div class="back-header">
                <i class="fas fa-arrow-left" onclick="history.back()"></i>
                <h3>🌙 ডার্ক মোড সেটিংস</h3>
            </div>

            <div class="setting-card">
                <h4>থিম নির্বাচন করুন</h4>
                <div class="theme-options">
                    <div class="theme-option active" onclick="selectTheme(this, 'light')" id="themeLight">
                        <span class="icon">☀️</span>
                        <div class="name">লাইট</div>
                        <div class="desc">উজ্জ্বল থিম</div>
                    </div>
                    <div class="theme-option" onclick="selectTheme(this, 'dark')" id="themeDark">
                        <span class="icon">🌙</span>
                        <div class="name">ডার্ক</div>
                        <div class="desc">গা dark ় থিম</div>
                    </div>
                    <div class="theme-option" onclick="selectTheme(this, 'auto')" id="themeAuto">
                        <span class="icon">🔄</span>
                        <div class="name">অটো</div>
                        <div class="desc">সিস্টেম অনুযায়ী</div>
                    </div>
                </div>

                <button class="btn-save-theme" onclick="saveTheme()">
                    <i class="fas fa-save"></i> থিম সংরক্ষণ করুন
                </button>
            </div>

            <div class="setting-card">
                <h4>পূর্বরূপ</h4>
                <div style="display:flex; gap:10px; padding:10px; background:#f8f9fa; border-radius:8px; transition:0.3s;" id="previewBox">
                    <body.dark-mode .setting-card .preview-box>
                        background: #2a2a4e;
                    </body.dark-mode>
                    <div style="flex:1;">
                        <div style="font-size:14px; font-weight:600; color:#1a1a2e;" id="previewTitle">লাইট থিম</div>
                        <div style="font-size:12px; color:#888;" id="previewDesc">এখানে আপনার থিমের পূর্বরূপ দেখা যাচ্ছে</div>
                    </div>
                    <div style="width:40px; height:40px; border-radius:50%; background:#e94560;"></div>
                </div>
            </div>

        </div>

        <div class="bottom-nav">
            <a href="index.html" class="nav-item">
                <i class="fas fa-home"></i>
                <span>হোম</span>
            </a>
            <a href="category.html" class="nav-item">
                <i class="fas fa-th-large"></i>
                <span>ক্যাটাগরি</span>
            </a>
            <a href="workers.html" class="nav-item">
                <i class="fas fa-users"></i>
                <span>ওয়ার্কার</span>
            </a>
            <a href="profile.html" class="nav-item active">
                <i class="fas fa-user"></i>
                <span>প্রোফাইল</span>
            </a>
        </div>
    </div>

    <script>
        let selectedTheme = 'light';

        document.addEventListener('DOMContentLoaded', function() {
            const savedTheme = localStorage.getItem('darkMode') === 'true' ? 'dark' : 'light';
            selectedTheme = savedTheme;

            document.querySelectorAll('.theme-option').forEach(opt => opt.classList.remove('active'));
            if (savedTheme === 'dark') {
                document.getElementById('themeDark').classList.add('active');
                document.body.classList.add('dark-mode');
                updatePreview('dark');
            } else {
                document.getElementById('themeLight').classList.add('active');
                document.body.classList.remove('dark-mode');
                updatePreview('light');
            }
        });

        function selectTheme(element, theme) {
            document.querySelectorAll('.theme-option').forEach(opt => opt.classList.remove('active'));
            element.classList.add('active');
            selectedTheme = theme;
            updatePreview(theme);
        }

        function updatePreview(theme) {
            const previewBox = document.getElementById('previewBox');
            const title = document.getElementById('previewTitle');
            const desc = document.getElementById('previewDesc');

            if (theme === 'dark') {
                previewBox.style.background = '#2a2a4e';
                title.style.color = '#fff';
                desc.style.color = '#888';
                title.textContent = 'ডার্ক থিম';
                desc.textContent = 'গা dark ় পরিবেশে সাইটটি দেখতে কেমন হবে';
            } else if (theme === 'auto') {
                previewBox.style.background = '#f8f9fa';
                title.style.color = '#1a1a2e';
                desc.style.color = '#888';
                title.textContent = 'অটো থিম';
                desc.textContent = 'সিস্টেম সেটিংস অনুযায়ী পরিবর্তন হবে';
            } else {
                previewBox.style.background = '#f8f9fa';
                title.style.color = '#1a1a2e';
                desc.style.color = '#888';
                title.textContent = 'লাইট থিম';
                desc.textContent = 'উজ্জ্বল পরিবেশে সাইটটি দেখতে কেমন হবে';
            }
        }

        function saveTheme() {
            const isDark = selectedTheme === 'dark';
            localStorage.setItem('darkMode', isDark);

            if (isDark) {
                document.body.classList.add('dark-mode');
            } else {
                document.body.classList.remove('dark-mode');
            }

            alert('✅ থিম সফলভাবে সংরক্ষণ করা হয়েছে!');
            window.location.href = 'profile.html';
        }

        function navigateToProfile() {
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            if (isLoggedIn) {
                window.location.href = 'profile.html';
            } else {
                window.location.href = 'login.html';
            }
        }
    </script>

</body>
</html>
